services:
  - type: web
    name: pharos-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: WATSONX_API_KEY
        sync: false
      - key: WATSONX_PROJECT_ID
        sync: false
      - key: WATSONX_URL
        value: https://us-south.ml.cloud.ibm.com
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://pharos.vercel.app,http://localhost:3000
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /api/health
    autoDeploy: true
    plan: free
