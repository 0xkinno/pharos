[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
]
ignore = [
    "E501",
    "B008",
    "B904",
    "B905",
    "C401",
    "C408",
    "UP007",
    "UP006",
    "UP042",
    "E741",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841", "B018", "E402"]
"scripts/*" = ["E402", "F401", "B007", "F841"]
